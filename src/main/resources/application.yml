server:
  port: 8080

spring:
  application:
    name: ApiGateway
  boot:
    admin:
      client:
        url: http://localhost:8081
        instance:
          service-base-url: http://localhost:8080
          prefer-ip: false
          metadata:
            unique-name: ApiGateway
            service-type: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: AuthService-docs
          uri: lb://AuthService
          predicates:
            - Path=/AuthService/v3/api-docs,/AuthService/v3/api-docs/**
          filters:
            - RewritePath=/AuthService/v3/api-docs(?<rest>.*), /v3/api-docs$\{rest}

        - id: AuthService
          uri: lb://AuthService
          predicates:
            - Path=/AuthService/**
          filters:
            - StripPrefix=1

        - id: AuthService-legacy
          uri: lb://AuthService
          predicates:
            - Path=/auth/**,/jwt/**

        - id: OrchestrationService
          uri: lb://OrchestrationService
          predicates:
            - Path=/OrchestrationService/**

        - id: OrchestrationService-legacy
          uri: lb://OrchestrationService
          predicates:
            - Path=/orchestration/**
          filters:
            - RewritePath=/orchestration/(?<segment>.*), /OrchestrationService/$\{segment}

        - id: OrchestrationService-demo
          uri: lb://OrchestrationService
          predicates:
            - Path=/Demo/**
          filters:
            - RewritePath=/Demo/(?<segment>.*), /OrchestrationService/Demo/$\{segment}

        - id: UserService
          uri: lb://UserService
          predicates:
            - Path=/UserService/**
          filters:
            - StripPrefix=1

        - id: UserService-legacy
          uri: lb://UserService
          predicates:
            - Path=/users/**

  main:
    web-application-type: reactive

info:
  app:
    name: ApiGateway
    type: gateway
    port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ApiGateway:8080
    metadata-map:
      unique-name: ApiGateway
      service-type: gateway
      port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: ApiGateway

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: AuthService
        url: /AuthService/v3/api-docs
      - name: OrchestrationService
        url: /OrchestrationService/v3/api-docs
      - name: UserService
        url: /UserService/v3/api-docs
  api-docs:
    enabled: true
    path: /v3/api-docs
